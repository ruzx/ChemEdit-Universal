name: Release Obsidian Plugin

on:
  push:
    # This triggers the workflow when you push a tag like '1.0.0' or 'v1.0.0'
    tags:
      - '*'

jobs:
  build:
    runs-sections: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}